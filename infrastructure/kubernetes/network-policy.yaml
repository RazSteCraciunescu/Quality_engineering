apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicshift-default
  namespace: civicshift
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: civicshift
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
