name: scheduled-non-functional

on:
  schedule:
    - cron: '41 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m uvicorn services.api.civicshift.main:app --host 127.0.0.1 --port 8000 &
      - run: |
          for attempt in {1..20}; do
            curl --fail http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          exit 1
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: automation/performance/k6/smoke.js

  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t civicshift:nightly .
      - run: docker run -d --name civicshift -p 8000:8000 civicshift:nightly
      - run: sleep 5
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          rules_file_name: automation/security/zap/rules.tsv
          fail_action: false
