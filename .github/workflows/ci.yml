name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -m "not browser" --cov=services/api/civicshift --cov-report=xml --cov-report=term-missing --junitxml=reports/generated/pytest-junit.xml
      - run: python scripts/validate_repository.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            coverage.xml
            reports/generated/pytest-junit.xml

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run test:unit
      - run: npm run lint

  browser-accessibility:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
            reports/generated/playwright-junit.xml

  container-smoke:
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t civicshift:${{ github.sha }} .
      - run: docker run -d --name civicshift -p 8000:8000 civicshift:${{ github.sha }}
      - run: |
          for attempt in {1..20}; do
            curl --fail http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          docker logs civicshift
          exit 1
